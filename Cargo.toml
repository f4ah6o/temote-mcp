[package]
name = "temote-mcp"
version = "2026.9.12"
edition = "2024"
license = "MIT AND Apache-2.0"
description = "A sandboxed local-machine MCP server with out-of-band approvals"
repository = "https://github.com/f4ah6o/temote-mcp"
readme = "README.md"
default-run = "temote-mcp"

[package.metadata.binstall]
# Release archives are generated by dist with versionless target filenames.
# Using GitHub's latest-release redirect keeps binary installs independent from
# the release-only Cargo.toml version commit.
pkg-url = "{ repo }/releases/latest/download/{ name }-{ target }.tar.xz"
pkg-fmt = "txz"
disabled-strategies = ["quick-install", "compile"]

[features]
default = ["network"]
network = [
    "dep:axum",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:dotenvy",
    "dep:reqwest",
    "dep:url",
    "dep:ring",
    "dep:zeroize",
    "dep:tower",
    "dep:unofficial-opencode-sdk",
]
[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true }
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
base64 = "0.22"
noargs = "0.4.3"
onepassword-sdk-unofficial = "0.3.0"
dotenvy = { version = "0.15", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
ring = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
unofficial-opencode-sdk = { version = "0.1.0", optional = true }
url = { version = "2", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zeroize = { version = "1.9.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler = "0.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
similar = "2"
noprop = "=0.2.0"
tempfile = "3"

# Shippable binaries built by dist.
[profile.dist]
inherits = "release"
lto = "thin"
