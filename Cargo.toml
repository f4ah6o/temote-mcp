[package]
name = "temote-mcp"
version = "2026.8.0"
edition = "2024"
license = "MIT AND Apache-2.0"
description = "A sandboxed local-machine MCP server with out-of-band approvals"
repository = "https://github.com/f4ah6o/temote-mcp"
readme = "README.md"
default-run = "temote-mcp"

[package.metadata.binstall]
# Release archives are generated by dist with versionless target filenames.
# Using GitHub's latest-release redirect lets --git installs stay independent
# from the release-only Cargo.toml version commit.
pkg-url = "{ repo }/releases/latest/download/{ name }-{ target }.tar.xz"
pkg-fmt = "txz"
disabled-strategies = ["quick-install", "compile"]

[features]
default = ["network"]
network = [
    "dep:axum",
    "dep:dotenvy",
    "dep:jsonwebtoken",
    "dep:reqwest",
    "dep:url",
]

[dependencies]
anyhow = "1"
axum = { version = "0.8", optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
dotenvy = { version = "0.15", optional = true }
jsonwebtoken = { version = "9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The unofficial-codex-rs fork keeps the upstream library crate names while
# publishing the packages under an explicitly unofficial namespace.
codex-protocol = { package = "unofficial-codex-protocol", version = "2026.8" }
codex-sandboxing = { package = "unofficial-codex-sandboxing", version = "2026.8" }
codex-utils-absolute-path = { package = "unofficial-codex-utils-absolute-path", version = "2026.8" }
codex-linux-sandbox = { package = "unofficial-codex-linux-sandbox", version = "2026.8" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# Shippable binaries built by dist.
[profile.dist]
inherits = "release"
lto = "thin"
