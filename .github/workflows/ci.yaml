name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Test gateway contract and runtime
        run: npm test --prefix gateway

  rust:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets --locked

      - name: Check no-default-features
        run: cargo check --no-default-features --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Set up Linux sandbox runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
          bwrap \
            --unshare-user \
            --unshare-net \
            --ro-bind / / \
            --proc /proc \
            --dev /dev \
            -- /bin/true

      - name: Build Linux sandbox helper
        if: runner.os == 'Linux'
        run: cargo build --bin temote-linux-sandbox --locked

      - name: Linux live sandbox acceptance
        if: runner.os == 'Linux'
        run: cargo test --lib --all-features --locked linux_tests -- --nocapture

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Supervisor upgrade path E2E
        timeout-minutes: 5
        run: cargo test --test cli_session_e2e --all-features --locked supervisor_upgrade_ -- --ignored --nocapture --test-threads=1

      - name: CLI session lifecycle E2E
        timeout-minutes: 5
        run: cargo test --test cli_session_e2e --all-features --locked supervisor_session_lifecycle_survives_console_eof_and_records_crash -- --ignored --nocapture

      - name: Verify Linux dependency boundary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          raw = subprocess.check_output([
              "cargo", "metadata", "--locked", "--format-version", "1",
              "--filter-platform", "x86_64-unknown-linux-gnu",
          ])
          metadata = json.loads(raw)
          nodes = metadata["resolve"]["nodes"]
          packages = {package["id"]: package for package in metadata["packages"]}
          root = metadata["resolve"]["root"]
          forbidden = sorted({
              packages[node["id"]]["name"]
              for node in nodes
              if packages[node["id"]]["name"] == "codex"
              or packages[node["id"]]["name"].startswith("codex-")
              or packages[node["id"]]["name"].startswith("unofficial-codex-")
          })
          if forbidden:
              raise SystemExit(f"forbidden runtime packages remain: {forbidden}")
          non_registry = sorted({
              packages[node["id"]]["name"]
              for node in nodes
              if node["id"] != root
              and not (packages[node["id"]].get("source") or "").startswith("registry+")
          })
          if non_registry:
              raise SystemExit(f"non-registry runtime packages remain: {non_registry}")
          print(f"x86_64-unknown-linux-gnu: {len(nodes)} packages")
          PY

      - name: Verify packaged crate manifest
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          python3 - <<'PY'
          import glob
          import io
          import pathlib
          import tarfile
          import tomllib

          crates = sorted(glob.glob("target/package/temote-mcp-*.crate"))
          if not crates:
              raise SystemExit("cargo package did not produce a temote-mcp crate")
          crate = pathlib.Path(crates[-1])
          with tarfile.open(crate) as archive:
              manifest_names = [
                  name for name in archive.getnames()
                  if name.count("/") == 1 and name.endswith("/Cargo.toml")
              ]
              if len(manifest_names) != 1:
                  raise SystemExit(f"unexpected packaged manifests: {manifest_names}")
              package_root = manifest_names[0].split("/", 1)[0]
              manifest = tomllib.loads(
                  archive.extractfile(manifest_names[0]).read().decode()
              )
              members = set(archive.getnames())
          if f"{package_root}/src/bin/temote-linux-sandbox.rs" not in members:
              raise SystemExit("temote-linux-sandbox source is missing from the crate")
          if f"{package_root}/src/bin/temote-onepassword-sdk.rs" not in members:
              raise SystemExit("temote-onepassword-sdk source is missing from the crate")
          if f"{package_root}/docs/linux-sandbox.md" not in members:
              raise SystemExit("Linux sandbox provenance documentation is missing from the crate")
          if f"{package_root}/THIRD_PARTY_NOTICES.md" not in members:
              raise SystemExit("third-party notice is missing from the crate")
          forbidden = []

          def visit(value, path=()):
              if isinstance(value, dict):
                  if "git" in value:
                      forbidden.append((path, "git dependency"))
                  for key, child in value.items():
                      visit(child, path + (key,))
              elif isinstance(value, list):
                  for child in value:
                      visit(child, path)

          visit(manifest.get("dependencies", {}), ("dependencies",))
          visit(manifest.get("dev-dependencies", {}), ("dev-dependencies",))
          visit(manifest.get("build-dependencies", {}), ("build-dependencies",))
          for target, target_table in manifest.get("target", {}).items():
              visit(target_table, ("target", target))
          def check_dependency_names(table, path):
              for section in ("dependencies", "dev-dependencies", "build-dependencies"):
                  for name, spec in table.get(section, {}).items():
                      package_name = spec.get("package", name) if isinstance(spec, dict) else name
                      if (
                          package_name == "codex"
                          or package_name.startswith("codex-")
                          or package_name.startswith("unofficial-codex-")
                      ):
                          forbidden.append((path + (section, name), package_name))

          check_dependency_names(manifest, ())
          for target, target_table in manifest.get("target", {}).items():
              check_dependency_names(target_table, ("target", target))
          if forbidden:
              raise SystemExit(f"forbidden packaged dependencies: {forbidden}")
          print(f"checked {crate}")
          PY


      - name: Install from packaged crate source
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          crate="$(ls -1t target/package/temote-mcp-*.crate | head -n1)"
          extract_root="$(mktemp -d)"
          install_root="$(mktemp -d)"
          trap 'rm -rf "$extract_root" "$install_root"' EXIT
          tar -xzf "$crate" -C "$extract_root"
          package_root="$(find "$extract_root" -mindepth 1 -maxdepth 1 -type d -name 'temote-mcp-*' -print -quit)"
          test -n "$package_root"
          cargo install --path "$package_root" --root "$install_root" --locked --force
          test -x "$install_root/bin/temote-mcp"
          test -x "$install_root/bin/temote-linux-sandbox"
          test -x "$install_root/bin/temote-onepassword-sdk"
          "$install_root/bin/temote-mcp" --version

      - name: Verify macOS dependency boundary
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess

          expected = {
              "aarch64-apple-darwin": 193,
          }
          for target, maximum in expected.items():
              raw = subprocess.check_output([
                  "cargo", "metadata", "--locked", "--format-version", "1",
                  "--filter-platform", target,
              ])
              metadata = json.loads(raw)
              nodes = metadata["resolve"]["nodes"]
              packages = {package["id"]: package for package in metadata["packages"]}
              forbidden = sorted({
                  packages[node["id"]]["name"]
                  for node in nodes
                  if packages[node["id"]]["name"] == "codex"
                  or packages[node["id"]]["name"].startswith("codex-")
                  or packages[node["id"]]["name"].startswith("unofficial-codex-")
              })
              if forbidden:
                  raise SystemExit(f"{target}: forbidden packages remain: {forbidden}")
              root = metadata["resolve"]["root"]
              non_registry = sorted({
                  packages[node["id"]]["name"]
                  for node in nodes
                  if node["id"] != root
                  and not (packages[node["id"]].get("source") or "").startswith("registry+")
              })
              if non_registry:
                  raise SystemExit(f"{target}: non-registry packages remain: {non_registry}")
              if len(nodes) > maximum:
                  raise SystemExit(
                      f"{target}: resolved package count {len(nodes)} exceeds {maximum}"
                  )
              print(f"{target}: {len(nodes)} packages, forbidden=0, registry-only")
          PY
